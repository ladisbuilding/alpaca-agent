[project]
name = "alpaca-committee"
version = "0.1.0"
description = "Autonomous investment committee — adversarial multi-agent options trading on Alpaca"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
